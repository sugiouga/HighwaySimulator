simulation:
  time_step: 0.1 # シミュレーションの時間ステップ[s]
  warmup_time: 5.0 # ウォームアップ時間[s]
  total_time: 30.0 # シミュレーションの総時間[s]
  goal_x: 120.0 # 目標位置のx座標[m]

visualization:
  enable: true # 可視化の有効化
  screen_width: 1200 # 画面の幅[px]
  screen_height: 300 # 画面の高さ[px]
  screen_color: "paleturquoise" # 画面の背景色
  frame_rate: 60 # フレームレート[FPS]
  caption: "Highway Simulator" # ウィンドウのタイトル
  ppm: 10 # ピクセルあたりのメートル数
  origin_x: 0.0 # 描画開始位置(ピクセル)

vehicle:
  mass: 1650 # 車両質量[kg]
  length: 4.5 # 車両長さ[m]
  width: 1.8 # 車両幅[m]
  min_velocity: 0.0 # 最小速度[m/s]
  max_velocity: 20.0 # 最大速度[m/s]
  min_acceleration: -3.0 # 最小加速度[m/s^2]
  max_acceleration: 2.0 # 最大加速度[m/s^2]
  max_steering_angle: 30.0 # 最大ステアリング角度[deg]
  max_steering_rate: 10.0 # 最大ステアリングレート[deg/s]
  model: "kinematic_bicycle" # 車両モデルの種類

policies:
  - policy_id: "IDM_Aggressive"
    type: "IDM"
    parameters:
      desired_velocity: 15.0  # 望ましい速度 [m/s]
      desired_time_headway: 1.5  # 望ましい時間頭部 [s]
      min_spacing: 2.0  # 最小車間距離 [m]
      comfortable_deceleration: 2.0  # 快適な減速度 [m/s^2]
    sensor_range: [
      40.0,  # 前方向の長さ [m]
      1.5   # 横方向の幅 [m]
    ]
    color: "blue" # 車両の色
  - policy_id: "IDM_Conservative"
    type: "IDM"
    parameters:
      desired_velocity: 15.0  # 望ましい速度 [m/s]
      desired_time_headway: 1.5  # 望ましい時間頭部 [s]
      min_spacing: 2.0  # 最小車間距離 [m]
      comfortable_deceleration: 2.0  # 快適な減速度 [m/s^2]
    sensor_range:
      front_distance: 40.0  # 前方向の長さ [m]
      side_distance: 1.7  # 横方向の幅 [m]
    color: "blue" # 車両の色
  - policy_id: "IDM_Normal"
    type: "IDM"
    parameters:
      desired_velocity: 15.0  # 望ましい速度 [m/s]
      desired_time_headway: 1.5  # 望ましい時間頭部 [s]
      min_spacing: 2.0  # 最小車間距離 [m]
      comfortable_deceleration: 2.0  # 快適な減速度 [m/s^2]
    sensor_range: [
      150.0,  # 前方向の長さ [m]
      1.6   # 横方向の幅 [m]
    ]
    color: "blue" # 車両の色
  - policy_id: "MPC_Agent"
    type: "MPC"
    parameters:
      mpc_horizon: 10  # MPCの予測ホライズン [ステップ数]
      mpc_time_step: 0.1  # MPCの時間ステップ [s]
    sensor_range: [
      40.0,  # 前方向の長さ [m]
      1.7   # 横方向の幅 [m]
    ]
    color: "red" # 車両の色
  - policy_id: "DRL_Agent"
    type: "RL"
    parameters: {}
    sensor_range: [
      40.0,  # 前方向の長さ [m]
      1.7   # 横方向の幅 [m]
    ]
    color: "red" # 車両の色
  - policy_id: "DRL_MPC_Agent"
    type: "RLMPC"
    parameters:
      mpc_horizon: 10  # MPCの予測ホライズン [ステップ数]
      mpc_time_step: 0.1  # MPCの時間ステップ [s]
    sensor_range: [
      40.0,  # 前方向の長さ [m]
      1.7   # 横方向の幅 [m]
    ]
    color: "red" # 車両の色

road_network:
  lane_width: 3.5 # 車線幅[m]
  lanes:
  - lane_id: "main_1_1"
    waypoints: [[-30, 0], [0, 0]]
  - lane_id: "main_1_2"
    waypoints: [[0, 0], [100, 0]]
    adj_right: "merge_1"
  - lane_id: "main_1_3"
    waypoints: [[100, 0], [125, 0]]
  - lane_id: "merge_1"
    waypoints: [[0, -3.5], [100, -3.5]]
    adj_left: "main_1_2"
  spawn_points:
  - id: "spawn_1"
    lane_id: "main_1_1"
    arrive_rate: 0.5 # 到着率[車両/s]
    s_start: 0.0 # スポーン開始位置[m]
    d_start: 0.0 # スポーン開始横位置[m]
    min_spawn_gap: 30.0 # スポーン時に前方車両との間に必要な最小車間距離[m]
    velocity_range: [10.0, 20.0]
    policies_distribution:
      IDM_Aggressive: 0.0
      IDM_Conservative: 0.0
      IDM_Normal: 1.0
  init_vehicles:
  - vehicle_id: "ego_vehicle"
    lane_id: "merge_1"
    s : 0.0
    d : 0.0
    velocity: 10.0
    policy_id: "DRL_Agent"
    is_ego: true

arrb_model:
  delta: 0.666  # 燃料消費モデルのデルタ項
  gamma1: 0.072  # 燃料消費モデルのガンマ項1
  gamma2: 0.00344  # 燃料消費モデルのガンマ項2
  d_1: 0.0269  # 燃料消費モデルのd_1項
  d_2: 0.0171  # 燃料消費モデルのd_2項
  d_3: 0.000672  # 燃料消費モデルのd_3項

reward:
  global_reward_scale: 0.05 # グローバル報酬のスケール

  success_reward: 1.0 # 合流成功の報酬
  collision_penalty: -1.0 # 衝突ペナルティ
  lane_deviation_penalty: -1.0 # 車線離脱ペナルティ
  timeout_penalty: -1.0 # タイムアウトペナルティ

  y_position_reward:
    enabled: true # y位置に基づく報酬の有効化
    weight: 0.1 # y位置に基づく報酬の重み
    std: {}
    target: 0 # 目標y位置[m]

  target_velocity_reward:
    enabled: true # 目標速度に基づく報酬の有効化
    weight: 0.80 # 目標速度に基づく報酬の重み
    std: 1.0 # 目標速度に基づく報酬の標準偏差
    target: 7.0 # 目標速度[m/s]

  following_vehicle_deceleration_penalty:
    enabled: true # 前方車両の減速ペナルティの有効化
    weight: 0.5 # 前方車両の減速ペナルティの重み
    std: {}
    target: {}

  acceleration_penalty:
    enabled: true # 加速度ペナルティの有効化
    weight: 0.005 # 加速度ペナルティの重み
    std: {}
    target: {}

  jerk_penalty:
    enabled: true # ジャークペナルティの有効化
    weight: 0.005 # ジャークペナルティの重み
    std: {}
    target: {}

  steering_angle_penalty:
    enabled: true # ステアリング角度ペナルティの有効化
    weight: 0.25 # ステアリング角度ペナルティの重み
    std: {}
    target: {}

  steering_rate_penalty:
    enabled: true # ステアリングレートペナルティの有効化
    weight: 0.05 # ステアリングレートペナルティの重み
    std: {}
    target: {}

rlmpc:
  mpc_horizon: 10 # MPCの予測ホライズン[ステップ数]
  mpc_time_step: 0.1 # MPCの1ステップあたりの時間[s]
  planning_time_min: 1.0 # 5次多項式軌道生成の計画時間の最小値[s]
  planning_time_max: 6.0 # 5次多項式軌道生成の計画時間の最大値[s]
  weights: # MPC重みの初期値・フォールバック値
    w_pos: 1.0 # 位置追従誤差の重み
    w_yaw: 0.0 # ヨー角追従誤差の重み
    w_vel: 1.0 # 速度追従誤差の重み
    w_accel: 0.5 # 加速度入力のペナルティ重み
    w_steer: 0.5 # 操舵角入力のペナルティ重み
    w_steer_rate: 0.5 # 操舵角速度入力のペナルティ重み
  weight_limits: # DRLが学習するMPC重みの範囲 [min, max]
    w_pos: [0.1, 50.0]
    w_yaw: [0.0, 10.0]
    w_vel: [0.1, 50.0]
    w_accel: [0.01, 10.0]
    w_steer: [0.01, 10.0]
    w_steer_rate: [0.01, 10.0]
  cbf: # 制御バリア関数（CBF）による安全制約
    enabled: true # CBFによる安全制約を有効にする
    max_obstacles: 4 # CBFで衝突回避対象とする周辺車両の最大数
    nearby_vehicle_range: 20.0 # CBF対象を探索する半径[m]
    gamma: 0.7 # 車間楕円CBFの減衰係数(0<gamma<=1、小さいほど保守的)
    ellipse: # 周辺車両を守る楕円形の安全領域
      use_dynamic_length: false # 速度に応じて長軸を動的に計算する
      fixed_length_margin: 2.5 # 固定長軸マージン[m]（use_dynamic_length=falseの場合）
      width_margin: 0.6 # 幅方向マージン[m]
    lane_margin: 0.1 # 車線離脱防止CBFのマージン[m]
    lane_gamma: 0.5 # 車線離脱防止CBFの減衰係数(0<gamma<=1)
    lane_slack_penalty: 1000.0 # 車線離脱防止CBFのスラック変数ペナルティ重み
    # 走行可能範囲は合流車線+本線の範囲からシグモイド関数で本線のみの範囲へ遷移する
    lane_sigmoid_steepness: 0.3 # シグモイド関数の傾き（大きいほど急峻に遷移）
    lane_sigmoid_transition_x: 80 # 遷移中心のx座標[m]。nullなら合流車線の終端xを自動使用

sac:
  policy: MlpPolicy
  total_timesteps: 5000
  learning_rate: 0.0003
  buffer_size: 100000
  learning_starts: 1000
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  ent_coef: auto
  target_update_interval: 1
  device: cuda
  policy_kwargs:
    net_arch: [256, 256]
