simulation:
  time_step: 0.1 # シミュレーションの時間ステップ[s]
  warmup_time: 5.0 # ウォームアップ時間[s]
  total_time: 30.0 # シミュレーションの総時間[s]
  goal_x: 115.0 # 目標位置のx座標[m]

visualization:
  enable: true # 可視化の有効化
  screen_width: 1200 # 画面の幅[px]
  screen_height: 300 # 画面の高さ[px]
  screen_color: "paleturquoise" # 画面の背景色
  caption: "Highway Simulator" # ウィンドウのタイトル
  ppm: 10 # ピクセルあたりのメートル数
  origin_x: 0.0 # 描画開始位置(ピクセル)

vehicle:
  mass: 1650 # 車両質量[kg]
  length: 4.5 # 車両長さ[m]
  width: 1.8 # 車両幅[m]
  min_velocity: 0.0 # 最小速度[m/s]
  max_velocity: 20.0 # 最大速度[m/s]
  min_acceleration: -3.0 # 最小加速度[m/s^2]
  max_acceleration: 2.0 # 最大加速度[m/s^2]
  max_steering_angle: 30.0 # 最大ステアリング角度[deg]
  max_steering_rate: 10.0 # 最大ステアリングレート[deg/s]
  model: "kinematic_bicycle" # 車両モデルの種類

policies:
  - policy_id: "IDM_Aggressive"
    type: "IDM"
    parameters:
      desired_velocity: 15.0  # 望ましい速度 [m/s]
      desired_time_headway: 1.5  # 望ましい時間頭部 [s]
      min_spacing: 2.0  # 最小車間距離 [m]
      comfortable_deceleration: 2.0  # 快適な減速度 [m/s^2]
    sensor_range: [
      40.0,  # 前方向の長さ [m]
      1.5   # 横方向の幅 [m]
    ]
    color: "blue" # 車両の色
  - policy_id: "IDM_Conservative"
    type: "IDM"
    parameters:
      desired_velocity: 15.0  # 望ましい速度 [m/s]
      desired_time_headway: 1.5  # 望ましい時間頭部 [s]
      min_spacing: 2.0  # 最小車間距離 [m]
      comfortable_deceleration: 2.0  # 快適な減速度 [m/s^2]
    sensor_range:
      front_distance: 40.0  # 前方向の長さ [m]
      side_distance: 1.7  # 横方向の幅 [m]
    color: "blue" # 車両の色
  - policy_id: "IDM_Normal"
    type: "IDM"
    parameters:
      desired_velocity: 15.0  # 望ましい速度 [m/s]
      desired_time_headway: 1.5  # 望ましい時間頭部 [s]
      min_spacing: 2.0  # 最小車間距離 [m]
      comfortable_deceleration: 2.0  # 快適な減速度 [m/s^2]
    sensor_range: [
      40.0,  # 前方向の長さ [m]
      1.6   # 横方向の幅 [m]
    ]
    color: "blue" # 車両の色
  - policy_id: "MPC_Agent"
    type: "MPC"
    parameters:
      mpc_horizon: 10  # MPCの予測ホライズン [ステップ数]
      mpc_time_step: 0.1  # MPCの時間ステップ [s]
    sensor_range: [
      40.0,  # 前方向の長さ [m]
      1.7   # 横方向の幅 [m]
    ]
    color: "red" # 車両の色
  - policy_id: "DRL_Agent"
    type: "RL"
    parameters: {}
    sensor_range: [
      40.0,  # 前方向の長さ [m]
      1.7   # 横方向の幅 [m]
    ]
    color: "red" # 車両の色
  - policy_id: "DRL_MPC_Agent"
    type: "RLMPC"
    parameters:
      mpc_horizon: 10  # MPCの予測ホライズン [ステップ数]
      mpc_time_step: 0.1  # MPCの時間ステップ [s]
    sensor_range: [
      40.0,  # 前方向の長さ [m]
      1.7   # 横方向の幅 [m]
    ]
    color: "red" # 車両の色

road_network:
  lane_width: 3.5 # 車線幅[m]
  lanes:
  - lane_id: "main_1_1"
    waypoints: [[-30, 0], [0, 0]]
  - lane_id: "main_1_2"
    waypoints: [[0, 0], [100, 0]]
    adj_right: "merge_1"
  - lane_id: "main_1_3"
    waypoints: [[100, 0], [120, 0]]
  - lane_id: "merge_1"
    waypoints: [[-20, -3.5], [100, -3.5]]
    adj_left: "main_1_2"
  spawn_points:
  - id: "spawn_1"
    lane_id: "main_1_1"
    arrive_rate: 0.3 # 到着率[車両/s]
    s_start: -20.0 # スポーン開始位置[m]
    d_start: 0.0 # スポーン開始横位置[m]
    velocity_range: [6.0, 8.0]
    policies_distribution:
      IDM_Aggressive: 0.0
      IDM_Conservative: 0.0
      IDM_Normal: 1.0
  init_vehicles:
  - id: "main_1_1_lead"
    lane_id: "main_1_1"
    s: 110.0
    d: 0.0
    velocity: 10.0
    policy_id: "IDM_Normal"


arrb_model:
  delta: 0.666  # 燃料消費モデルのデルタ項
  gamma1: 0.072  # 燃料消費モデルのガンマ項1
  gamma2: 0.00344  # 燃料消費モデルのガンマ項2
  d_1: 0.0269  # 燃料消費モデルのd_1項
  d_2: 0.0171  # 燃料消費モデルのd_2項
  d_3: 0.000672  # 燃料消費モデルのd_3項

reward:
  global_reward_scale: 1.0 # グローバル報酬のスケール

  success_reward: 1.0 # 合流成功の報酬
  collision_penalty: -1.0 # 衝突ペナルティ
  lane_deviation_penalty: -1.0 # 車線離脱ペナルティ
  timeout_penalty: -1.0 # タイムアウトペナルティ

  y_position_reward:
    enabled: true # y位置に基づく報酬の有効化
    weight: 0.025 # y位置に基づく報酬の重み
    std: {}
    target: 0 # 目標y位置[m]

  target_velocity_reward:
    enabled: true # 目標速度に基づく報酬の有効化
    weight: 0.15 # 目標速度に基づく報酬の重み
    std: 2.0 # 目標速度に基づく報酬の標準偏差
    target: 15.0 # 目標速度[m/s]

  following_vehicle_deceleration_penalty:
    enabled: true # 前方車両の減速ペナルティの有効化
    weight: 0.01 # 前方車両の減速ペナルティの重み
    std: {}
    target: {}

  jerk_penalty:
    enabled: true # ジャークペナルティの有効化
    weight: 0.0025 # ジャークペナルティの重み
    std: {}
    target: {}

sac:
  policy: MlpPolicy
  learning_rate: 0.0003
  buffer_size: 100000
  learning_starts: 1000
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  ent_coef: auto
  target_update_interval: 1
  device: auto
  policy_kwargs:
    net_arch: [256, 256]
